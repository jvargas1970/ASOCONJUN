<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validar carnet colegiado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }
        h1 {
            color: #222;
        }
        form {
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 8px;
            width: 200px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Validar carnet colegiado</h1>
    <form method="post">
        {% csrf_token %}
        <label for="carnet_colegiado">Carnet colegiado:</label><br>
        <input type="text" name="carnet_colegiado" id="carnet_colegiado" required><br>
        <button type="submit">Validar</button>
    </form>
</body>
</html>
