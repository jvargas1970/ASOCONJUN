<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validar carnet colegiado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Validar carnet colegiado</h2>
    <form method="post">
        {% csrf_token %}
        <label for="carne_colegiado">Carnet colegiado:</label><br>
        <input type="text" name="carne_colegiado" required><br>
        <button type="submit">Validar</button>
    </form>
</body>
</html>
