<!DOCTYPE html>
<html>
<head>
    <title>ASOCONJUN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="text-primary">Bienvenido a ASOCONJUN 🚀</h1>
    <p class="lead">Lista de socios registrados:</p>

    <ul class="list-group">
        {% for socio in socios %}
            <li class="list-group-item">{{ socio.nombre }}</li>
        {% empty %}
            <li class="list-group-item">No hay socios registrados aún.</li>
        {% endfor %}
    </ul>

    <hr>
    <h2>Opciones</h2>
    <ul class="list-group">
        <li class="list-group-item"><a href="/registro/">Registrar socio</a></li>
        <li class="list-group-item"><a href="/aprobar/">Aprobar socios</a></li>
        <li class="list-group-item"><a href="/admin/">Panel de administración</a></li>
    </ul>
</body>
</html>
