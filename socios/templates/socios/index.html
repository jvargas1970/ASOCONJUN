{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ASOCONJUN</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-image: url("{% static 'images/fondo.jpg' %}");
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
        }
        .centered {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px #000;
        }
        .btn-lg {
            font-size: 1.2rem;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="centered">
        <h1 class="mb-4">Bienvenido a ASOCONJUN 🚀</h1>
        <div class="d-grid gap-3 col-6 mx-auto">
            <a href="/registro-form/" class="btn btn-primary btn-lg">
                <i class="bi bi-person-plus"></i> Registrar socio
            </a>
            <a href="/aprobar/" class="btn btn-success btn-lg">
                <i class="bi bi-check-circle"></i> Aprobar socios
            </a>
            <a href="/admin/" class="btn btn-dark btn-lg">
                <i class="bi bi-gear"></i> Panel de administración
            </a>
        </div>
    </div>
</body>
</html>
